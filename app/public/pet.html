<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桌宠</title>
<link rel="stylesheet" href="/pet.css?v=0.9.1">
<script type="module" src="/pet.js?v=0.9.1"></script>
</head>
<body>
<main class="pet" id="pet">
  <div class="bubble" id="bubble" hidden>
    <p id="line"></p>
    <small id="doing"></small>
  </div>
  <button class="body" id="face-button" type="button" title="点一下，看看我在做什么">
    <span class="halo" aria-hidden="true"></span>
    <img id="face" alt="">
    <span id="face-fallback">伴</span>
  </button>
  <p class="name" id="name">陪伴</p>
  <div class="status" id="status" role="status">正在唤醒…</div>
  <div class="bar">
    <button id="observe" type="button">看一眼</button>
    <button id="pause" type="button">暂停</button>
    <button id="dress" type="button">换形象</button>
  </div>
  <a class="open-app" id="open-app" href="/" target="_blank" rel="noreferrer">打开陪伴 ↗</a>
  <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
</main>
</body>
</html>
